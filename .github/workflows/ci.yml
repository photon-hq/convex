name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its run still in progress. Keyed by
# the pull request number, as branches from different forks can share a
# name; runs on main each get their own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      # Build first: `typecheck` covers example/convex, which imports
      # `@photon-ai/convex` by package self-reference and so resolves through
      # `exports` into dist/.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      # src/component/_generated and example/convex/_generated are committed.
      # Regenerate both against a local anonymous backend, which needs no
      # Convex account, and fail if the committed copies are stale.
      - name: Check generated code is current
        env:
          CONVEX_AGENT_MODE: anonymous
        run: |
          npx convex dev --once --typecheck disable
          npx convex codegen --component-dir ./src/component
          git diff --exit-code -- src/component/_generated example/convex/_generated
