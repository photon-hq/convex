name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      # Build first: `typecheck` covers example/convex, which imports
      # `@photon-ai/convex` by package self-reference and so resolves through
      # `exports` into dist/.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
