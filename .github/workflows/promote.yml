name: Promote to production

on:
  workflow_dispatch:
    inputs:
      staging_version:
        type: string
        default: ""
        description: Staging version to promote (blank promotes the current staging tag)

permissions:
  contents: read

jobs:
  promote:
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@9287b81f7187d136cb5c9b143a2400b6d4e460dd
    permissions:
      contents: write
      packages: read
      actions: read
      attestations: read
      id-token: write
    with:
      registry: https://registry.npmjs.org
      package: "@photon-ai/convex"
      staging-version: ${{ inputs.staging_version }}
