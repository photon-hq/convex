name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Deployment branches of this environment are limited to `main`, so a
    # `release.yml` edited on another branch cannot publish.
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Changesets needs history to work out what has changed since the
          # last release.
          fetch-depth: 0
          # changesets/action pushes with its own `github-token`, so the
          # checkout's credentials need not stay in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # Points npm at the public registry. Authentication is not a token —
          # see the publish step.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The same gate CI runs. `convex codegen` is deliberately not run here:
      # it needs a live deployment, and `src/component/_generated` is committed.
      - run: npm run build
      - run: npm run check
      - run: npm run typecheck
      - run: npm test

      # v2 is required: v1 does not see what @changesets/cli v3 published, so
      # it skips the git tag and the GitHub release.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Opens/updates the "Version Packages" PR when changesets are
          # pending; publishes when that PR has been merged.
          version-script: npm run version
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # `create-github-releases` and `push-git-tags` both default to true.
        # No GITHUB_TOKEN env var: v2 dropped support for it and reads the
        # `github-token` input, which defaults to ${{ github.token }}.
        #
        # npm auth is trusted publishing (OIDC), not a token — npm trusts this
        # repo's `release.yml`, and `id-token: write` above lets the runner mint
        # the short-lived credential. Nothing to rotate, and provenance is
        # attached automatically. Needs npm >= 11.5.1 (Node 24 ships 11.17.0).
